exclude: ^\.specify/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --project bench ty check --project bench
        language: system
        pass_filenames: false
        files: ^bench/
      - id: dart-format
        name: dart format
        entry: dart format --set-exit-if-changed
        language: system
        files: ^app/.*\.dart$
      - id: dart-analyze
        name: dart analyze
        entry: dart analyze --fatal-infos app
        language: system
        pass_filenames: false
        files: ^app/.*\.dart$
      - id: swift-format
        name: swift format lint
        entry: swift format lint --strict
        language: system
        files: \.swift$
        exclude: (GeneratedPluginRegistrant\.swift$|/ephemeral/)
      - id: ktlint
        name: ktlint
        entry: ktlint
        language: system
        files: \.kts?$
